name: Switch
description: Switch (operating as Livekick at livekick.com) is a 500 Global-backed company running
  a virtual fitness and yoga SaaS platform. The Livekick Serve product lets movement teachers and
  wellness creators deliver live and on-demand classes, videos, courses, and programs to students and
  communities, with subscription billing and creator tooling to grow an online audience. The public
  surface is a consumer/creator web and mobile application backed by an internal Django REST API; as of
  this enrichment pass Livekick publishes no public developer program — no developer portal,
  documentation, OpenAPI specification, SDKs, MCP server, or security.txt (all /.well-known and
  /llms.txt paths return the single-page-app shell). This profile is therefore identity-only, enriched
  with a probed domain-security posture rather than API artifacts.
